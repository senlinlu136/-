name: Hengxin Build

on:
  workflow_dispatch:
  push:
    branches: [main, master, hengxin]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk

      - name: Sign APK for install verification
        run: |
          keytool -genkeypair -keystore test.keystore -alias test -keyalg RSA -keysize 2048 -validity 3650 -storepass testpass -keypass testpass -dname "CN=Hengxin,O=Hengxin,C=CN"
          APKSIGNER=$(find "$ANDROID_HOME" -name apksigner -type f 2>/dev/null | head -n1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" sign --ks test.keystore --ks-pass pass:testpass --key-pass pass:testpass --ks-key-alias test --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out app-release-signed.apk app-release.apk
          ls -la app-release-signed.apk

      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: app-release-signed.apk
          if-no-files-found: error
          retention-days: 7

  smoke-test-android:
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/download-artifact@v8
        with:
          name: android-release
          path: .

      - name: Launch emulator and verify app starts (no crash)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            pwd
            ls -la
            adb wait-for-device
            adb install -r app-release-signed.apk
            adb shell am start -W -n org.traccar.client/org.traccar.client.MainActivity
            sleep 10
            adb shell pidof org.traccar.client > /dev/null || { echo "App process not running after launch — crashed."; exit 1; }
            echo "APP LAUNCHED OK"
